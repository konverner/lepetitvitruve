<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arc brisé</title>
  <desc id="desc">Élévation schématique d'un arc brisé : deux arcs égaux qui se rejoignent en pointe, entre deux piédroits.</desc>

  <!-- Piers -->
  <g data-part="piedroits" class="part-shape">
    <rect x="30" y="70" width="10" height="30"
          stroke="var(--text-primary, currentColor)" stroke-width="2"
          stroke-linejoin="round"/>
    <rect x="80" y="70" width="10" height="30"
          stroke="var(--text-primary, currentColor)" stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Extrados: two equal arcs meeting at the apex -->
  <g data-part="extrados" class="part-shape">
    <path d="M30 70 A60 60 0 0 1 60 18.04 A60 60 0 0 1 90 70"
          stroke="var(--text-primary, currentColor)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Intrados: two equal arcs breaking at a point -->
  <g data-part="intrados" class="part-shape">
    <path d="M40 70 A40 40 0 0 1 60 35.36 A40 40 0 0 1 80 70"
          stroke="var(--text-primary, currentColor)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Clef: the joint where the two arcs meet -->
  <g data-part="clef" class="part-shape">
    <path d="M60 35.36 L60 18.04"
          stroke="var(--text-primary, currentColor)" stroke-width="1.3"
          stroke-linecap="round"/>
  </g>
</svg>
