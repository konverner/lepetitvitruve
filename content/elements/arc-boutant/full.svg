<svg viewBox="0 100 500 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Arc-boutant</title>
  <desc id="desc">Élévation détaillée d'un arc-boutant : un arc segmentaire, appareillé de claveaux rayonnants, reporte la poussée du mur de la nef sur une culée couronnée d'un pinacle.</desc>
  <!-- Ground / stone floor reference -->
  <g data-part="sol" class="part-shape">
    <line x1="40" y1="650" x2="440" y2="650"
          stroke="var(--text-muted, currentColor)" stroke-width="1.5"
          stroke-linecap="round" opacity="0.55"/>
    <line x1="70" y1="656" x2="415" y2="656"
          stroke="var(--text-muted, currentColor)" stroke-width="0.9"
          stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Nave wall (clerestory wall receiving the thrust) -->
  <g data-part="mur" class="part-shape">
    <rect x="60" y="180" width="40" height="470"
          stroke="var(--text-primary, currentColor)" stroke-width="2.4"
          stroke-linejoin="round"/>
    <line x1="54" y1="180" x2="106" y2="180"
          stroke="var(--text-primary, currentColor)" stroke-width="0.9"
          stroke-linecap="round" opacity="0.35"/>
    <line x1="54" y1="270" x2="106" y2="270"
          stroke="var(--text-primary, currentColor)" stroke-width="0.9"
          stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Buttress pier (culée) taking the thrust down to the ground -->
  <g data-part="culee" class="part-shape">
    <rect x="360" y="260" width="60" height="390"
          stroke="var(--text-primary, currentColor)" stroke-width="2.4"
          stroke-linejoin="round"/>
    <line x1="354" y1="380" x2="426" y2="380"
          stroke="var(--text-primary, currentColor)" stroke-width="0.9"
          stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Pinnacle: adds dead load on the pier -->
  <g data-part="pinacle" class="part-shape">
    <path d="M370 260 L370 200 L390 130 L410 200 L410 260"
          stroke="var(--text-primary, currentColor)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10"/>
  </g>

  <!-- Extrados: upper line of the flying arch -->
  <g data-part="extrados" class="part-shape">
    <path d="M360 340 A260 260 0 0 0 100 230"
          stroke="var(--text-primary, currentColor)" stroke-width="2.4"
          stroke-linecap="round"/>
  </g>

  <!-- Intrados: lower line of the flying arch, a segmental arc -->
  <g data-part="intrados" class="part-shape">
    <path d="M360 380 A260 260 0 0 0 100 270"
          stroke="var(--text-primary, currentColor)" stroke-width="2.4"
          stroke-linecap="round"/>
  </g>

  <!-- Claveaux: radiating voussoir joints -->
  <g data-part="claveaux" class="part-shape">
    <path d="M328.3 341.77 L347.22 322.76
             M289.91 310.27 L307.89 283.5
             M246.23 286.64 L260.4 253.14
             M198.85 271.74 L206.94 233.59
             M149.51 266.13 L150.22 226.14"
          stroke="var(--text-primary, currentColor)" stroke-width="1.3"
          stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>