             C80 126 88 126 88 133
             C88 139 84 153 84 153
             C84 153 80 139 80 133Z" />

    <path class="outline" d="M158 133
             C158 126 166 126 166 133
             C166 139 162 153 162 153
             C162 153 158 139 158 133Z" />

    <path class="outline" d="M236 133
             C236 126 244 126 244 133
             C244 139 240 153 240 153
             C240 153 236 139 236 133Z" />

    <path class="outline" d="M314 133
             C314 126 322 126 322 133
             C322 139 318 153 318 153
             C318 153 314 139 314 133Z" />

    <path class="outline" d="M392 133
             C392 126 400 126 400 133
             C400 139 396 153 396 153
             C396 153 392 139 392 133Z" />
  </g>
</svg>
