<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 478" fill="none">

  <style>
    .outline,
    .detail {
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: all;
    }

    .outline {
      fill: var(--graphic-fill, transparent);
      stroke: var(--graphic-stroke, currentColor);
      stroke-width: 1.6;
    }

    .primary {
      stroke-width: 2.4;
    }

    .detail {
      fill: none;
      stroke: var(--graphic-stroke, currentColor);
      stroke-width: 0.9;
      stroke-opacity: 0.52;
    }

    .context {
      stroke-opacity: 0.38;
    }

    [data-part] {
      cursor: pointer;
      pointer-events: bounding-box;
      outline: none;
    }

    [data-part]:hover :is(.outline, .detail),
    [data-part]:focus-visible :is(.outline, .detail),
    [data-part].active :is(.outline, .detail) {
      stroke: var(--accent-interactive);
      stroke-opacity: 1;
    }

    [data-part]:hover .outline,
    [data-part]:focus-visible .outline,
    [data-part].active .outline {
      fill: color-mix(in srgb, var(--accent-interactive) 10%, transparent);
    }
  </style>

  <g data-part="window">

    <!-- Masonry joints -->
    <path class="detail context" d="M0 112H66M414 112H480
             M0 168H66M414 168H480
             M0 224H66M414 224H480
             M0 280H66M414 280H480
             M0 336H66M414 336H480
             M0 392H66M414 392H480
             M0 448H66M414 448H480" />

    <path class="detail context" d="M26 112V168M40 168V224M22 224V280M36 280V336M24 336V392M38 392V448
             M454 112V168M440 168V224M458 224V280M444 280V336M456 336V392M442 392V448" />

    <!-- Window concealed at its head by the lambrequin -->
    <path class="outline primary" d="M82 176V442H398V176" />

    <path class="outline" d="M98 176V428H382V176" />

    <!-- Mullions -->
    <path class="outline" d="M236 176V428M244 176V428" />

    <!-- Transoms -->
    <path class="detail" d="M98 218H382M98 258H382" />

    <!-- Sill -->
    <path class="outline primary" d="M72 442H408V454H72Z" />

    <path class="outline" d="M62 454H418V462H62Z" />

    <path class="detail" d="M82 448H398" />
  </g>

  <g data-part="roof">

    <path class="outline primary" d="M28 44H452L430 18H50Z" />

    <!-- Roofing joints -->
    <path class="detail" d="M82 44L76 18
             M128 44L122 18
             M174 44L168 18
             M220 44L214 18
             M266 44L260 18
             M312 44L306 18
             M358 44L352 18
             M404 44L398 18" />

    <!-- Drip edge -->
    <path class="outline primary" d="M18 44H462V58H18Z" />

    <path class="detail" d="M18 51H462" />
  </g>

  <g data-part="support">

    <path class="outline primary" d="M34 58H446V82H34Z" />

    <path class="detail" d="M48 70H432" />

    <circle class="detail" cx="58" cy="70" r="1.8" />
    <circle class="detail" cx="149" cy="70" r="1.8" />
    <circle class="detail" cx="240" cy="70" r="1.8" />
    <circle class="detail" cx="331" cy="70" r="1.8" />
    <circle class="detail" cx="422" cy="70" r="1.8" />
  </g>

  <g data-part="lambrequin">

    <!-- Fixing band -->
    <path class="outline primary" d="M44 82H436V100H44Z" />

    <path class="detail" d="M44 91H436" />

    <!-- Repeating ornamental lower edge -->
    <path class="outline primary" d="M44 100V118
             C55 118 57 128 61 140
             C65 153 70 166 84 174
             C98 166 103 153 107 140
             C111 128 112 118 123 118

             C134 118 135 128 139 140
             C143 153 148 166 162 174
             C176 166 181 153 185 140
