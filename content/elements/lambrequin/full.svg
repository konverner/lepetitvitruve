             M201 101V116
             M279 101V116
             M357 101V116" />
  </g>

  <g data-part="motif">

    <circle class="outline" cx="84" cy="111" r="4.5" />
    <circle class="outline" cx="162" cy="111" r="4.5" />
    <circle class="outline" cx="240" cy="111" r="4.5" />
    <circle class="outline" cx="318" cy="111" r="4.5" />
    <circle class="outline" cx="396" cy="111" r="4.5" />

