             C332 166 337 153 341 140
             C345 128 346 118 357 118

             C368 118 369 128 373 140
             C377 153 382 166 396 174
             C410 166 415 153 419 140
             C423 128 425 118 436 118
             V100Z" />

    <!-- Subtle construction lines -->
